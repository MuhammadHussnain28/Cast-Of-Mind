<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- TODO: favicon pending — client to supply. -->
     <link rel="icon" type="image/png" href="/cast-of-mind-logo-ink.png" />
    <meta name="theme-color" content="#19122B" />
    <!--
      `interactive-widget=resizes-content` tells the browser to SHRINK the
      viewport when a software keyboard opens, rather than drawing the keyboard
      over it. Without it, the chat portal's full-height layout keeps its full
      height and the composer ends up underneath the keyboard, so somebody
      cannot see what they are typing.

      Honoured by Chromium (Android). Safari ignores it, which is why
      `lib/useVisualViewport.js` measures `visualViewport` as well. Added
      2026-09-16 with the developer's explicit approval, because this line is
      global and affects every page — not only the portal.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />

    <!--
      Both stylesheets are preloaded before they are applied.

      Without it the browser discovers the font CSS, then discovers the woff2
      inside it, then paints — so the home page's 72px headline renders in
      Georgia first and reflows to Fraunces a moment later. That flash lands on
      the largest text on the most important screen of the site.

      This shortens the chain; it does not delete it. Removing the swap entirely
      means self-hosting the woff2 files and preloading those directly, which is
      a bigger change than this chunk owns. Noted in docs/ongoing.md.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700&display=swap"
    />
    <link
      href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700&display=swap"
      rel="stylesheet"
    />
